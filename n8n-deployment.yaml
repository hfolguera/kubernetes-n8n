apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: n8n
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /data"]
          volumeMounts:
            - name: n8n-claim0
              mountPath: /data
      containers:
        - command:
            - /bin/sh
          args:
            - -c
            - sleep 5; n8n start
          env:
            - name: N8N_METRICS
              value: "true"
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres.postgres.svc.calfolguera.com
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_PORT
              value: "5678"
            - name: EXTERNAL_HOOK_FILES
              value: "/home/node/.n8n/hooks.js"
            - name: OIDC_ISSUER_URL
              value: "https://authentik.calfolguera.freemyip.com/application/o/n8n/"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-authentik-secret
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-authentik-secret
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: "https://n8n.calfolguera.freemyip.com/auth/oidc/callback"
            - name: N8N_ADDITIONAL_NON_UI_ROUTES
              value: "auth"
            - name: EXTERNAL_FRONTEND_HOOKS_URLS
              value: "/assets/oidc-frontend-hook.js"
            - name: OIDC_SCOPES
              value: "openid email profile"  
          image: n8nio/n8n:latest
          name: n8n
          imagePullPolicy: Always
          ports:
            - containerPort: 5678
          resources:
            requests:
              memory: "250Mi"
            limits:
              memory: "500Mi"
          volumeMounts:
            - name: n8n-claim0
              mountPath: /home/node/.n8n
            - name: n8n-authentik-hook
              mountPath: /home/node/.n8n/hooks.js
              subPath: hooks.js
      restartPolicy: Always
      volumes:
        - name: n8n-claim0
          persistentVolumeClaim:
            claimName: n8n-claim0
        - name: n8n-secret
          secret:
            secretName: n8n-secret
        - name: postgres-secret
          secret:
            secretName: postgres-secret
        - name: n8n-authentik-hook
          configMap:
            name: n8n-authentik-hook

